name: test-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xiaoha-cleaner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.7', '3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        shell: pwsh
        run: |
          $files = Get-ChildItem . -Recurse -Filter *.py |
            Where-Object { $_.FullName -notmatch '[\\/]dist[\\/]' } |
            ForEach-Object FullName
          python -m py_compile @files
      - name: Unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

  package:
    name: Build Windows release
    needs: test
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Build standalone executable and release archive
        shell: powershell
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'
          } else {
            (Get-Content .\VERSION -Raw).Trim()
          }
          $exeResult = .\tools\Build-Executable.ps1 -Version $version | ConvertFrom-Json
          .\tools\Build-Release.ps1 -Version $version -ExecutablePath $exeResult.executable
      - name: Verify release archive
        shell: powershell
        run: |
          $archives = @(Get-ChildItem .\dist -Filter xiaoha-cleaner-*-windows.zip -File)
          $executables = @(Get-ChildItem .\dist -Filter xiaoha-cleaner-*-windows-x64.exe -File)
          $archiveChecksums = @(Get-ChildItem .\dist -Filter xiaoha-cleaner-*-windows.zip.sha256 -File)
          $executableChecksums = @(Get-ChildItem .\dist -Filter xiaoha-cleaner-*-windows-x64.exe.sha256 -File)
          if ($archives.Count -ne 1) { throw "Expected one ZIP, found $($archives.Count)" }
          if ($executables.Count -ne 1) { throw "Expected one EXE, found $($executables.Count)" }
          if ($archiveChecksums.Count -ne 1) { throw "Expected one ZIP checksum, found $($archiveChecksums.Count)" }
          if ($executableChecksums.Count -ne 1) { throw "Expected one EXE checksum, found $($executableChecksums.Count)" }
          $pairs = @(
            [pscustomobject]@{ Asset = $archives[0]; Checksum = $archiveChecksums[0] },
            [pscustomobject]@{ Asset = $executables[0]; Checksum = $executableChecksums[0] }
          )
          foreach ($pair in $pairs) {
            $expected = (Get-Content $pair.Checksum.FullName -Raw).Split(' ')[0].Trim().ToLowerInvariant()
            $actual = (Get-FileHash $pair.Asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "SHA-256 verification failed: $($pair.Asset.Name)" }
            if ((Get-Content $pair.Checksum.FullName -Raw) -notmatch [regex]::Escape($pair.Asset.Name)) {
              throw "Checksum does not bind asset filename: $($pair.Asset.Name)"
            }
          }
          $stage = Get-ChildItem .\dist -Directory | Select-Object -First 1
          foreach ($file in @('xiaoha-cleaner.exe', 'xiaoha-cleaner.cmd', 'xiaoha-cleaner.py', 'XiaohaCleanerGui.py', 'README.md', 'VERSION', 'component-manifest.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage.FullName $file) -PathType Leaf)) {
              throw "Missing release file: $file"
            }
          }
          $expectedVersion = (Get-Content -LiteralPath (Join-Path $stage.FullName 'VERSION') -Raw).Trim().TrimStart('v')
          $reportedVersion = & (Join-Path $stage.FullName 'xiaoha-cleaner.cmd') --version
          if ($LASTEXITCODE -ne 0 -or $reportedVersion.Trim() -ne $expectedVersion) {
            throw "Stable CMD version mismatch: $reportedVersion"
          }
          $exeVersion = & (Join-Path $stage.FullName 'xiaoha-cleaner.exe') --version
          if ($LASTEXITCODE -ne 0 -or $exeVersion.Trim() -ne $expectedVersion) {
            throw "Stable EXE version mismatch: $exeVersion"
          }
          & (Join-Path $stage.FullName 'xiaoha-cleaner.exe') --gui-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Stable EXE GUI smoke test failed' }
          .\tests\Test-Executable.ps1 -ExecutablePath (Join-Path $stage.FullName 'xiaoha-cleaner.exe')
          $failureOutput = Join-Path $env:RUNNER_TEMP 'xiaoha-release-failed-scan'
          $oldErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & (Join-Path $stage.FullName 'xiaoha-cleaner.exe') scan (Join-Path $env:RUNNER_TEMP 'missing-xiaoha-target') --output $failureOutput *> $null
          $failedScanExitCode = $LASTEXITCODE
          $ErrorActionPreference = $oldErrorActionPreference
          if ($failedScanExitCode -ne 1) {
            throw "Stable CMD failed scan returned $failedScanExitCode instead of 1"
          }
          $failureReport = Get-Content -LiteralPath (Join-Path $failureOutput 'scan-report.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$failureReport.status -ne 'scan-failed' -or -not [bool]$failureReport.terminal) {
            throw 'Stable CMD failed scan report is not a terminal scan-failed result'
          }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoha-cleaner-windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Trigger CK toolbox rebuild
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.CK_TOOLBOX_TRIGGER_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Warning 'CK_TOOLBOX_TRIGGER_TOKEN is not configured; toolbox rebuild was not triggered.'
            exit 0
          }
          gh workflow run build-release.yml --repo ch-jack/ck_free_toolbox --ref main -f "source_component=xiaoha_cleaner" -f "source_version=$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to trigger CK toolbox rebuild: $LASTEXITCODE"
          }
